name: Package Wildfire Lab PC and Mobile APKs

on:
  workflow_run:
    workflows:
      - Build Wildfire Lab native engine
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apks:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Wildfire Lab
        uses: actions/checkout@v5

      - name: Checkout pinned Limbo source
        uses: actions/checkout@v5
        with:
          repository: limboemu/limbo
          ref: 887c6a68cd6b414377d7f8071bc12bbc16e59809
          path: LimboSource

      - name: Resolve native engine workflow run
        id: native
        uses: actions/github-script@v7
        with:
          script: |
            let runId;
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (!run || run.conclusion !== "success") {
                core.setFailed("The native engine workflow did not complete successfully.");
                return;
              }
              runId = run.id;
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build-native.yml",
                branch: "main",
                status: "completed",
                per_page: 20
              });
              const run = data.workflow_runs.find(item => item.conclusion === "success");
              if (!run) {
                core.setFailed("No successful multi-architecture native engine build is available.");
                return;
              }
              runId = run.id;
            }
            core.setOutput("run_id", String(runId));

      - name: Download multi-architecture native engine
        uses: actions/download-artifact@v4
        with:
          name: wildfirelab-native-arm64-multiarch
          path: native-engine
          repository: notskide/wildfire
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -eux
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.3"

      - name: Install Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Install x86 and ARM guest engines
        run: |
          set -eux
          mkdir -p LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a
          mkdir -p LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a
          mkdir -p LimboSource/limbo-android-arm/src/main/jniLibs/arm64-v8a
          cp -a native-engine/common/. LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/x86/. LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/arm/. LimboSource/limbo-android-arm/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/assets/. LimboSource/limbo-android-x86/src/main/assets/
          cp -a native-engine/assets/. LimboSource/limbo-android-arm/src/main/assets/
          test -f LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          test -f LimboSource/limbo-android-arm/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so

      - name: Apply Wildfire ROM ZIP importer
        run: |
          set -eux
          python3 scripts/apply-limbo-patches.py "$GITHUB_WORKSPACE/LimboSource"

      - name: Brand and configure both editions
        working-directory: LimboSource
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          icon_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111820"
                  android:pathData="M20,0H88A20,20 0,0 1,108 20V88A20,20 0,0 1,88 108H20A20,20 0,0 1,0 88V20A20,20 0,0 1,20 0Z" />
              <path
                  android:fillColor="#F06B45"
                  android:pathData="M55,17C50,29 40,37 35,50C28,68 39,88 56,91C72,94 84,82 82,66C81,54 72,43 66,35C66,48 61,54 55,59C58,45 57,31 55,17Z" />
              <path
                  android:fillColor="#FFE2B8"
                  android:pathData="M55,57C50,63 46,69 47,76C48,83 56,87 62,82C68,77 64,68 60,63C59,69 56,73 53,75C54,68 54,62 55,57Z" />
          </vector>
          """

          def replace_once(path, old, new):
              value = path.read_text()
              if value.count(old) != 1:
                  raise SystemExit(f"Expected one branding anchor in {path}: {old}")
              path.write_text(value.replace(old, new, 1))

          editions = [
              {
                  "module": "limbo-android-x86",
                  "name": "Wildfire Lab PC",
                  "short": "Wildfire PC",
                  "old_name": "Limbo x86 PC Emulator",
                  "old_short": "Limbo x86",
                  "version_code": "20000",
                  "activity": "src/main/java/com/limbo/emu/main/LimboEmuActivity.java"
              },
              {
                  "module": "limbo-android-arm",
                  "name": "Wildfire Lab Mobile",
                  "short": "Wildfire Mobile",
                  "old_name": "Limbo ARM Emulator",
                  "old_short": "Limbo ARM",
                  "version_code": "30000",
                  "activity": "src/main/java/com/limbo/emu/main/arm/LimboEmuActivity.java"
              }
          ]

          for edition in editions:
              module = Path(edition["module"])
              strings = module / "src/main/res/values/strings.xml"
              replace_once(strings, f'<string name="app_name">{edition["old_name"]}</string>', f'<string name="app_name">{edition["name"]}</string>')
              replace_once(strings, f'<string name="app_short_name">{edition["old_short"]}</string>', f'<string name="app_short_name">{edition["short"]}</string>')

              manifest = module / "src/main/AndroidManifest.xml"
              value = manifest.read_text()
              value = value.replace(f'android:label="{edition["old_name"]}"', f'android:label="{edition["name"]}"')
              value = value.replace(f'android:label="{edition["old_short"]}"', f'android:label="{edition["short"]}"')
              if edition["name"] not in value:
                  raise SystemExit(f"Could not brand {edition['module']}")
              manifest.write_text(value)

              activity = module / edition["activity"]
              value = activity.read_text()
              if "Config.enableKVM = true;" in value:
                  value = value.replace("Config.enableKVM = true;", "Config.enableKVM = false;", 1)
              if "Config.enableKVM = false;" not in value:
                  raise SystemExit(f"KVM must be disabled in {activity}")
              if "Config.enableSDLSound = false;" not in value:
                  value = value.replace("Config.enableKVM = false;", "Config.enableKVM = false;\n        Config.enableSDLSound = false;", 1)
              if "Config.enableSoftwareUpdates = false;" not in value:
                  value = value.replace("Config.enableSDLSound = false;", "Config.enableSDLSound = false;\n        Config.enableSoftwareUpdates = false;", 1)
              activity.write_text(value)

              gradle = module / "build.gradle"
              value = gradle.read_text()
              application_id = 'applicationId "com.limbo.emu.main"' if edition["module"].endswith("x86") else 'applicationId "com.limbo.emu.main.arm"'
              if value.count(application_id) != 1:
                  raise SystemExit(f"Could not find applicationId in {gradle}")
              value = value.replace(application_id, application_id + f'\n        versionCode {edition["version_code"]}\n        versionName "0.3.0"', 1)
              value = value.replace('abiFilters "armeabi-v7a","arm64-v8a", "x86", "x86_64"', 'abiFilters "arm64-v8a"')
              gradle.write_text(value)

              for folder in ("drawable", "drawable-ldpi", "drawable-mdpi", "drawable-hdpi"):
                  icon = module / "src/main/res" / folder / "limbo.xml"
                  icon.parent.mkdir(parents=True, exist_ok=True)
                  icon.write_text(icon_xml)

          base = Path("limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java")
          value = base.read_text()
          needle = '            if (Build.VERSION.SDK_INT >= 26)' + chr(10) + '                System.loadLibrary("compat-SDL2-addons");'
          if value.count(needle) != 1:
              raise SystemExit("Expected optional SDL audio addon load was not found exactly once")
          base.write_text(value.replace(needle, "", 1))
          PY

      - name: Build Wildfire Lab PC and Mobile APKs
        working-directory: LimboSource
        run: |
          set -eux
          gradle :limbo-android-x86:assembleDebug :limbo-android-arm:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp limbo-android-x86/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-output/WildfireLab-PC-0.3.0.apk"
          cp limbo-android-arm/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-output/WildfireLab-Mobile-0.3.0.apk"
          "$ANDROID_HOME/build-tools/29.0.3/aapt" dump badging "$GITHUB_WORKSPACE/apk-output/WildfireLab-PC-0.3.0.apk" | grep -E "package: name='com.limbo.emu.main'|application-label:'Wildfire Lab PC'"
          "$ANDROID_HOME/build-tools/29.0.3/aapt" dump badging "$GITHUB_WORKSPACE/apk-output/WildfireLab-Mobile-0.3.0.apk" | grep -E "package: name='com.limbo.emu.main.arm'|application-label:'Wildfire Lab Mobile'"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-PC-0.3.0.apk" | grep -E "lib/arm64-v8a/libqemu-system-x86_64.so|assets/QEMU_VERSION|assets/roms/bios.bin"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-Mobile-0.3.0.apk" | grep -E "lib/arm64-v8a/libqemu-system-aarch64.so|assets/QEMU_VERSION"

      - name: Upload Wildfire Lab APKs
        uses: actions/upload-artifact@v4
        with:
          name: wildfirelab-pc-and-mobile-apks
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
