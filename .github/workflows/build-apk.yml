name: Package Wildfire Lab 0.2.0 APK

on:
  push:
    branches:
      - apk-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Wildfire Lab
        uses: actions/checkout@v5

      - name: Checkout Limbo Android integration
        uses: actions/checkout@v5
        with:
          repository: limboemu/limbo
          ref: master
          path: LimboSource

      - name: Download the verified ARM64 QEMU engine
        uses: actions/download-artifact@v4
        with:
          name: wildfirelab-native-arm64-x86_64
          path: native-engine
          repository: notskide/wildfire
          run-id: 42451186295
          github-token: ${{ github.token }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build packages
        run: |
          set -eux
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.3"

      - name: Install Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Install the native engine into the Android modules
        run: |
          set -eux
          mkdir -p LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a
          mkdir -p LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a
          cp -a native-engine/common/. LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/qemu/. LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/assets/. LimboSource/limbo-android-x86/src/main/assets/
          test -f LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a/libcompat-limbo.so
          test -f LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a/libSDL2.so
          test -f LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          readelf -h LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so | grep 'Machine:.*AArch64'

      - name: Brand and configure Wildfire Lab
        working-directory: LimboSource
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("limbo-android-x86/src/main/res/values/strings.xml")
          value = strings.read_text()
          value = value.replace('<string name="app_name">Limbo x86 PC Emulator</string>', '<string name="app_name">Wildfire Lab</string>')
          value = value.replace('<string name="app_short_name">Limbo x86</string>', '<string name="app_short_name">Wildfire Lab</string>')
          if 'name="app_name">Wildfire Lab<' not in value:
              raise SystemExit("App name was not updated")
          strings.write_text(value)

          manifest = Path("limbo-android-x86/src/main/AndroidManifest.xml")
          value = manifest.read_text()
          value = value.replace('android:label="Limbo x86 PC Emulator"', 'android:label="Wildfire Lab"')
          value = value.replace('android:label="Limbo x86"', 'android:label="Wildfire Lab"')
          if 'android:label="Limbo x86' in value:
              raise SystemExit("Manifest still contains Limbo branding")
          manifest.write_text(value)

          activity = Path("limbo-android-x86/src/main/java/com/limbo/emu/main/LimboEmuActivity.java")
          value = activity.read_text()
          value = value.replace('Config.enableKVM = true;', 'Config.enableKVM = false;')
          value = value.replace('Config.enableKVM = false;', 'Config.enableKVM = false;' + chr(10) + '        Config.enableSDLSound = false;' + chr(10) + '        Config.enableSoftwareUpdates = false;')
          if 'Config.enableKVM = true;' in value:
              raise SystemExit("KVM must remain disabled for this build")
          activity.write_text(value)

          base = Path("limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java")
          value = base.read_text()
          needle = '            if (Build.VERSION.SDK_INT >= 26)' + chr(10) + '                System.loadLibrary("compat-SDL2-addons");'
          if value.count(needle) != 1:
              raise SystemExit("Expected optional SDL audio addon load was not found exactly once")
          value = value.replace(needle, '')
          base.write_text(value)

          gradle = Path("limbo-android-x86/build.gradle")
          value = gradle.read_text()
          value = value.replace('applicationId "com.limbo.emu.main"', 'applicationId "com.limbo.emu.main"' + chr(10) + '        versionCode 20000' + chr(10) + '        versionName "0.2.0"')
          if 'versionName "0.2.0"' not in value:
              raise SystemExit("App version was not updated")
          gradle.write_text(value)
          PY

      - name: Build Wildfire Lab APK
        working-directory: LimboSource
        run: |
          set -eux
          gradle :limbo-android-x86:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp limbo-android-x86/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.2.0.apk"
          "$ANDROID_HOME/build-tools/29.0.3/aapt" dump badging "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.2.0.apk" | grep -E "package:|application-label:"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.2.0.apk" | grep -E "lib/arm64-v8a/libqemu-system-x86_64.so|assets/QEMU_VERSION|assets/roms/bios.bin"

      - name: Upload Wildfire Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: wildfire-lab-0.2.0-apk
          path: apk-output/WildfireLab-0.2.0.apk
          if-no-files-found: error
          retention-days: 14
