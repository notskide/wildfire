name: Package Wildfire Lab PC and Mobile APKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "patches/**"
      - "scripts/**"
      - "README.md"
  workflow_run:
    workflows:
      - Build Wildfire Lab native engine
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apks:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Wildfire Lab
        uses: actions/checkout@v5

      - name: Checkout pinned Limbo source
        uses: actions/checkout@v5
        with:
          repository: limboemu/limbo
          ref: 887c6a68cd6b414377d7f8071bc12bbc16e59809
          path: LimboSource

      - name: Resolve native engine workflow run
        id: native
        uses: actions/github-script@v7
        with:
          script: |
            let runId;
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (!run || run.conclusion !== "success") {
                core.setFailed("The native engine workflow did not complete successfully.");
                return;
              }
              runId = run.id;
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "build-native.yml",
                branch: "main",
                status: "completed",
                per_page: 20
              });
              const run = data.workflow_runs.find(item => item.conclusion === "success");
              if (!run) {
                core.setFailed("No successful multi-architecture native engine build is available.");
                return;
              }
              runId = run.id;
            }
            core.setOutput("run_id", String(runId));

      - name: Download multi-architecture native engine
        uses: actions/download-artifact@v4
        with:
          name: wildfirelab-native-arm64-multiarch
          path: native-engine
          repository: notskide/wildfire
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -eux
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.3"

      - name: Install Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Install both guest engines into one APK module
        run: |
          set -eux
          mkdir -p LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a
          mkdir -p LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a
          cp -a native-engine/common/. LimboSource/limbo-android-lib/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/x86/. LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/arm/. LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/
          cp -a native-engine/assets/. LimboSource/limbo-android-x86/src/main/assets/
          test -f LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          test -f LimboSource/limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so

      - name: Apply Wildfire ROM ZIP importer
        run: |
          set -eux
          python3 scripts/apply-limbo-patches.py "$GITHUB_WORKSPACE/LimboSource"

      - name: Configure unified Wildfire Lab app
        working-directory: LimboSource
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              value = path.read_text()
              if value.count(old) != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}: {old}")
              path.write_text(value.replace(old, new, 1))

          module = Path("limbo-android-x86")
          strings = module / "src/main/res/values/strings.xml"
          replace_once(strings, '<string name="app_name">Limbo x86 PC Emulator</string>', '<string name="app_name">Wildfire Lab</string>')
          replace_once(strings, '<string name="app_short_name">Limbo x86</string>', '<string name="app_short_name">Wildfire Lab</string>')

          manifest = module / "src/main/AndroidManifest.xml"
          value = manifest.read_text()
          launcher = '''            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>'''
          if value.count(launcher) != 1:
              raise SystemExit("Expected the original PC launcher intent filter exactly once")
          value = value.replace(launcher, "", 1)
          value = value.replace('''        <activity
            android:name="LimboEmuActivity"''', '''        <activity
            android:name="com.limbo.emu.main.WildfireHomeActivity"
            android:exported="true"
            android:label="Wildfire Lab"
            android:theme="@style/Theme.AppCompat.NoActionBar">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        <activity
            android:name="com.limbo.emu.main.arm.LimboEmuActivity"
            android:exported="false"
            android:label="Wildfire Lab ARM64"
            android:theme="@style/Theme.AppCompat.NoActionBar" />
        <activity
            android:name="LimboEmuActivity"
            android:exported="false"''', 1)
          value = value.replace('android:label="Limbo x86 PC Emulator"', 'android:label="Wildfire Lab"')
          value = value.replace('android:label="Limbo x86"', 'android:label="Wildfire Lab PC"')
          if "WildfireHomeActivity" not in value or "com.limbo.emu.main.arm.LimboEmuActivity" not in value:
              raise SystemExit("Unified architecture activities were not added to the manifest")
          manifest.write_text(value)

          activity = module / "src/main/java/com/limbo/emu/main/LimboEmuActivity.java"
          value = activity.read_text()
          value = value.replace("Config.enableKVM = true;", "Config.enableKVM = false;", 1)
          if "Config.enableKVM = false;" not in value:
              raise SystemExit("KVM must be disabled for the Android host")
          value = value.replace("LimboApplication.arch = Config.Arch.x86_64;", "LimboApplication.arch = Config.Arch.x86_64;\\n        Config.machineFolder = \"machines/\";\\n        Config.enableEmulatedFloppy = true;\\n        Config.enableEmulatedSDCard = false;", 1)
          if "Config.enableSDLSound = false;" not in value:
              value = value.replace("Config.enableKVM = false;", "Config.enableKVM = false;\n        Config.enableSDLSound = false;", 1)
          if "Config.enableSoftwareUpdates = false;" not in value:
              value = value.replace("Config.enableSDLSound = false;", "Config.enableSDLSound = false;\n        Config.enableSoftwareUpdates = false;", 1)
          activity.write_text(value)

          gradle = module / "build.gradle"
          value = gradle.read_text()
          value = value.replace('applicationId "com.limbo.emu.main"', 'applicationId "com.limbo.emu.main"\n        versionCode 40000\n        versionName "0.4.0"', 1)
          value = value.replace('abiFilters "armeabi-v7a","arm64-v8a", "x86", "x86_64"', 'abiFilters "arm64-v8a"')
          if 'versionName "0.4.0"' not in value:
              raise SystemExit("Unified app version was not configured")
          gradle.write_text(value)

          icon_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111820" android:pathData="M20,0H88A20,20 0,0 1,108 20V88A20,20 0,0 1,88 108H20A20,20 0,0 1,0 88V20A20,20 0,0 1,20 0Z" />
              <path android:fillColor="#F06B45" android:pathData="M55,17C50,29 40,37 35,50C28,68 39,88 56,91C72,94 84,82 82,66C81,54 72,43 66,35C66,48 61,54 55,59C58,45 57,31 55,17Z" />
              <path android:fillColor="#FFE2B8" android:pathData="M55,57C50,63 46,69 47,76C48,83 56,87 62,82C68,77 64,68 60,63C59,69 56,73 53,75C54,68 54,62 55,57Z" />
          </vector>
          """
          for folder in ("drawable", "drawable-ldpi", "drawable-mdpi", "drawable-hdpi"):
              icon = module / "src/main/res" / folder / "limbo.xml"
              icon.parent.mkdir(parents=True, exist_ok=True)
              icon.write_text(icon_xml)

          base = Path("limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java")
          value = base.read_text()
          needle = '            if (Build.VERSION.SDK_INT >= 26)' + chr(10) + '                System.loadLibrary("compat-SDL2-addons");'
          if value.count(needle) != 1:
              raise SystemExit("Expected optional SDL audio addon load was not found exactly once")
          base.write_text(value.replace(needle, "", 1))
          PY

      - name: Build unified Wildfire Lab APK
        working-directory: LimboSource
        run: |
          set -eux
          gradle :limbo-android-x86:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp limbo-android-x86/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.4.0.apk"
          "$ANDROID_HOME/build-tools/29.0.3/aapt" dump badging "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.4.0.apk" | grep -E "package: name='com.limbo.emu.main'|application-label:'Wildfire Lab'"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.4.0.apk" | grep "lib/arm64-v8a/libqemu-system-x86_64.so"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.4.0.apk" | grep "lib/arm64-v8a/libqemu-system-aarch64.so"
          unzip -l "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.4.0.apk" | grep -E "assets/QEMU_VERSION|assets/roms/bios.bin"

      - name: Upload unified Wildfire Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: wildfirelab-unified-apk
          path: apk-output/WildfireLab-0.4.0.apk
          if-no-files-found: error
          retention-days: 30
