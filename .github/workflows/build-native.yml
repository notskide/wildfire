name: Build Wildfire Lab 0.2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-arm64-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Wildfire Lab build repository
        uses: actions/checkout@v5

      - name: Checkout Limbo native source
        uses: actions/checkout@v5
        with:
          repository: limboemu/limbo
          ref: master
          path: LimboSource

      - name: Install Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake git python2.7 python3 binutils libtool-bin pkg-config flex bison gettext texinfo rsync patch wget curl xz-utils unzip gtk-doc-tools
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python
          python --version
          python3 --version

      - name: Install legacy NDK r14b
        run: |
          set -eux
          curl -fL https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip -o "$RUNNER_TEMP/android-ndk-r14b.zip"
          unzip -q "$RUNNER_TEMP/android-ndk-r14b.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r14b/ndk-build"
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-r14b" >> "$GITHUB_ENV"

      - name: Download native dependencies
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        run: |
          set -eux
          curl -fL https://download.qemu.org/qemu-2.9.1.tar.xz -o /tmp/qemu.tar.xz
          tar -xJf /tmp/qemu.tar.xz -C /tmp
          mv /tmp/qemu-2.9.1 qemu
          curl -fL https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz -o /tmp/glib.tar.xz
          tar -xJf /tmp/glib.tar.xz -C /tmp
          mv /tmp/glib-2.56.1 glib
          curl -fL https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz -C /tmp
          mv /tmp/libffi-3.3 libffi
          curl -fL https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -o /tmp/pixman.tar.gz
          tar -xzf /tmp/pixman.tar.gz -C /tmp
          mv /tmp/pixman-0.40.0 pixman
          curl -fL https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -o /tmp/sdl2.tar.gz
          tar -xzf /tmp/sdl2.tar.gz -C /tmp
          mv /tmp/SDL2-2.0.8 SDL2

      - name: Apply Limbo patches
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        run: |
          set -eux
          patch -d qemu -p1 < patches/qemu-2.9.1.patch
          patch -d glib -p1 < patches/glib-2.56.1.patch
          patch -d SDL2 -p1 < patches/sdl2-2.0.8.patch

      - name: Compile ARM64 Android engine for x86_64 guests
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        env:
          NDK_ENV: linux-x86_64
          USE_GCC: "true"
          BUILD_HOST: arm64-v8a
          BUILD_GUEST: x86_64-softmmu
          USE_QEMU_VERSION: "2.9.1"
          USE_AAUDIO: "false"
          USE_KVM: "false"
        run: |
          set -eux
          make -j2 limbo NDK_ROOT="$NDK_ROOT" NDK_ENV="$NDK_ENV" USE_GCC="$USE_GCC" BUILD_HOST="$BUILD_HOST" BUILD_GUEST="$BUILD_GUEST" USE_QEMU_VERSION="$USE_QEMU_VERSION" USE_AAUDIO="$USE_AAUDIO" USE_KVM="$USE_KVM"

      - name: Verify ARM64 shared libraries and package engine
        working-directory: LimboSource
        run: |
          set -eux
          find limbo-android-lib/src/main/jniLibs/arm64-v8a limbo-android-x86/src/main/jniLibs/arm64-v8a -type f -name '*.so' -print
          test -f limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so
          readelf -h limbo-android-x86/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so | grep -E 'Class:|Machine:'
          mkdir -p "$GITHUB_WORKSPACE/native-engine"
          cp -a limbo-android-lib/src/main/jniLibs/arm64-v8a "$GITHUB_WORKSPACE/native-engine/common"
          cp -a limbo-android-x86/src/main/jniLibs/arm64-v8a "$GITHUB_WORKSPACE/native-engine/qemu"
          cp -a limbo-android-x86/src/main/assets "$GITHUB_WORKSPACE/native-engine/assets"


      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.7.1

      - name: Brand and configure Wildfire Lab
        working-directory: LimboSource
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("limbo-android-x86/src/main/res/values/strings.xml")
          value = strings.read_text()
          value = value.replace('<string name="app_name">Limbo x86 PC Emulator</string>', '<string name="app_name">Wildfire Lab</string>')
          value = value.replace('<string name="app_short_name">Limbo x86</string>', '<string name="app_short_name">Wildfire Lab</string>')
          strings.write_text(value)

          manifest = Path("limbo-android-x86/src/main/AndroidManifest.xml")
          value = manifest.read_text().replace('android:label="Limbo x86"', 'android:label="Wildfire Lab"')
          manifest.write_text(value)

          activity = Path("limbo-android-x86/src/main/java/com/limbo/emu/main/LimboEmuActivity.java")
          value = activity.read_text()
          value = value.replace('Config.enableKVM = true;', 'Config.enableKVM = false;')
          value = value.replace('Config.enableKVM = false;', 'Config.enableKVM = false;\n        Config.enableSDLSound = false;\n        Config.enableSoftwareUpdates = false;')
          activity.write_text(value)

          base = Path("limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java")
          value = base.read_text()
          value, count = re.subn(r'\\s*if \\(Build\\.VERSION\\.SDK_INT >= 26\\)\\s*System\\.loadLibrary\\("compat-SDL2-addons"\\);\\s*', '\\n', value)
          if count != 1:
              raise SystemExit("Expected optional SDL audio addon load was not found exactly once")
          base.write_text(value)

          gradle = Path("limbo-android-x86/build.gradle")
          value = gradle.read_text()
          value = value.replace('applicationId "com.limbo.emu.main"', 'applicationId "com.limbo.emu.main"\\n        versionCode 20000\\n        versionName "0.2.0"')
          gradle.write_text(value)
          PY

      - name: Build Wildfire Lab APK
        working-directory: LimboSource
        run: |
          set -eux
          gradle :limbo-android-x86:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp limbo-android-x86/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-output/WildfireLab-0.2.0.apk"

      - name: Upload Wildfire Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: wildfire-lab-0.2.0-apk
          path: apk-output/WildfireLab-0.2.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildfirelab-native-arm64-x86_64
          path: native-engine/
          if-no-files-found: error
          retention-days: 14
