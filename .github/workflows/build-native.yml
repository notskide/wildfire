name: Build Wildfire Lab native engine

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-native.yml"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-multiarch-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Wildfire Lab
        uses: actions/checkout@v5

      - name: Checkout pinned Limbo source
        uses: actions/checkout@v5
        with:
          repository: limboemu/limbo
          ref: 887c6a68cd6b414377d7f8071bc12bbc16e59809
          path: LimboSource

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake git python2.7 python3 binutils libtool-bin pkg-config flex bison gettext texinfo rsync patch wget curl xz-utils unzip gtk-doc-tools
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python
          python --version
          python3 --version

      - name: Install legacy NDK r14b
        run: |
          set -eux
          curl -fL https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip -o "$RUNNER_TEMP/android-ndk-r14b.zip"
          unzip -q "$RUNNER_TEMP/android-ndk-r14b.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r14b/ndk-build"
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-r14b" >> "$GITHUB_ENV"

      - name: Download native dependencies
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        run: |
          set -eux
          curl -fL https://download.qemu.org/qemu-2.9.1.tar.xz -o /tmp/qemu.tar.xz
          tar -xJf /tmp/qemu.tar.xz -C /tmp
          mv /tmp/qemu-2.9.1 qemu
          curl -fL https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz -o /tmp/glib.tar.xz
          tar -xJf /tmp/glib.tar.xz -C /tmp
          mv /tmp/glib-2.56.1 glib
          curl -fL https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz -C /tmp
          mv /tmp/libffi-3.3 libffi
          curl -fL https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -o /tmp/pixman.tar.gz
          tar -xzf /tmp/pixman.tar.gz -C /tmp
          mv /tmp/pixman-0.40.0 pixman
          curl -fL https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -o /tmp/sdl2.tar.gz
          tar -xzf /tmp/sdl2.tar.gz -C /tmp
          mv /tmp/SDL2-2.0.8 SDL2

      - name: Apply upstream native patches
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        run: |
          set -eux
          patch -d qemu -p1 < patches/qemu-2.9.1.patch
          patch -d glib -p1 < patches/glib-2.56.1.patch
          patch -d SDL2 -p1 < patches/sdl2-2.0.8.patch

      - name: Optimize SDL framebuffer uploads and refresh pacing
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              value = path.read_text()
              if value.count(old) != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}: {old}")
              path.write_text(value.replace(old, new, 1))

          qemu_display = Path("qemu/ui/sdl2.c")
          replace_once(
              qemu_display,
              "scon->real_renderer = SDL_CreateRenderer(scon->real_window, -1, SDL_RENDERER_ACCELERATED);",
              """scon->real_renderer = SDL_CreateRenderer(scon->real_window, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);
              if (!scon->real_renderer) {
                  SDL_ClearError();
                  scon->real_renderer = SDL_CreateRenderer(scon->real_window, -1, SDL_RENDERER_ACCELERATED);
              }
              if (!scon->real_renderer) {
                  SDL_ClearError();
                  scon->real_renderer = SDL_CreateRenderer(scon->real_window, -1, 0);
              }"""
          )

          qemu_console = Path("qemu/ui/console.c")
          replace_once(
              qemu_console,
              "int gui_refresh_interval_default = 30;",
              "int gui_refresh_interval_default = 16;"
          )

          qemu_blit = Path("qemu/ui/sdl2-2d.c")
          replace_once(
              qemu_blit,
              """void sdl2_2d_update(DisplayChangeListener *dcl,
                              int x, int y, int w, int h)
          {
              struct sdl2_console *scon = container_of(dcl, struct sdl2_console, dcl);
              DisplaySurface *surf = qemu_console_surface(dcl->con);
              SDL_Rect rect;

              assert(!scon->opengl);

              if (!surf) {
                  return;
              }
              if (!scon->texture) {
                  return;
              }

              /*
               * SDL2 seems to do some double-buffering, and trying to only
               * update the changed areas results in only one of the two buffers
               * being updated.  Which flickers alot.  So lets not try to be
               * clever do a full update every time ...
               */
          #if 0
              rect.x = x;
              rect.y = y;
              rect.w = w;
              rect.h = h;
          #else
              rect.x = 0;
              rect.y = 0;
              rect.w = surface_width(surf);
              rect.h = surface_height(surf);
          #endif

              SDL_UpdateTexture(scon->texture, NULL, surface_data(surf),
                                surface_stride(surf));
              SDL_RenderCopy(scon->real_renderer, scon->texture, &rect, &rect);
              SDL_RenderPresent(scon->real_renderer);
          }""",
              """void sdl2_2d_update(DisplayChangeListener *dcl,
                              int x, int y, int w, int h)
          {
              struct sdl2_console *scon = container_of(dcl, struct sdl2_console, dcl);
              DisplaySurface *surf = qemu_console_surface(dcl->con);
              SDL_Rect rect;
              size_t surface_data_offset;

              assert(!scon->opengl);

              if (!surf || !scon->texture || w <= 0 || h <= 0) {
                  return;
              }

              surface_data_offset = surface_bytes_per_pixel(surf) * x +
                                    surface_stride(surf) * y;
              rect.x = x;
              rect.y = y;
              rect.w = w;
              rect.h = h;

              SDL_UpdateTexture(scon->texture, &rect,
                                (const uint8_t *)surface_data(surf) + surface_data_offset,
                                surface_stride(surf));
              SDL_RenderClear(scon->real_renderer);
              SDL_RenderCopy(scon->real_renderer, scon->texture, NULL, NULL);
              SDL_RenderPresent(scon->real_renderer);
          }"""
          )

          display_source = qemu_display.read_text()
          console_source = qemu_console.read_text()
          blit_source = qemu_blit.read_text()
          if "SDL_RENDERER_PRESENTVSYNC" not in display_source:
              raise SystemExit("SDL vertical-sync presentation was not enabled")
          if "SDL_CreateRenderer(scon->real_window, -1, 0)" not in display_source:
              raise SystemExit("SDL fallback renderer was not configured")
          if "gui_refresh_interval_default = 16;" not in console_source:
              raise SystemExit("The 60 Hz display refresh interval was not configured")
          if "SDL_UpdateTexture(scon->texture, &rect" not in blit_source:
              raise SystemExit("Dirty-rectangle texture uploads were not enabled")
          if "SDL_UpdateTexture(scon->texture, NULL" in blit_source:
              raise SystemExit("Full-frame texture uploads are still enabled")
          PY

      - name: Compile ARM64 Android host engines for PC and phone guests
        working-directory: LimboSource/limbo-android-lib/src/main/jni
        env:
          NDK_ENV: linux-x86_64
          USE_GCC: "true"
          BUILD_HOST: arm64-v8a
          BUILD_GUEST: x86_64-softmmu,aarch64-softmmu
          USE_QEMU_VERSION: "2.9.1"
          USE_AAUDIO: "false"
          USE_KVM: "false"
        run: |
          set -eux
          make -j2 limbo NDK_ROOT="$NDK_ROOT" NDK_ENV="$NDK_ENV" USE_GCC="$USE_GCC" BUILD_HOST="$BUILD_HOST" BUILD_GUEST="$BUILD_GUEST" USE_QEMU_VERSION="$USE_QEMU_VERSION" USE_AAUDIO="$USE_AAUDIO" USE_KVM="$USE_KVM"

      - name: Verify all guest engines and package native files
        working-directory: LimboSource
        run: |
          set -eux
          X86_LIBS=limbo-android-x86/src/main/jniLibs/arm64-v8a
          ARM_LIBS=limbo-android-arm/src/main/jniLibs/arm64-v8a
          test -f "$X86_LIBS/libqemu-system-x86_64.so"
          test -f "$ARM_LIBS/libqemu-system-aarch64.so"
          for library in "$X86_LIBS/libqemu-system-x86_64.so" "$ARM_LIBS/libqemu-system-aarch64.so"; do
            readelf -h "$library" | grep 'Machine:.*AArch64'
          done
          test -f limbo-android-lib/src/main/jniLibs/arm64-v8a/libcompat-limbo.so
          test -f limbo-android-lib/src/main/jniLibs/arm64-v8a/libSDL2.so
          mkdir -p "$GITHUB_WORKSPACE/native-engine/common" "$GITHUB_WORKSPACE/native-engine/x86" "$GITHUB_WORKSPACE/native-engine/arm" "$GITHUB_WORKSPACE/native-engine/assets"
          cp -a limbo-android-lib/src/main/jniLibs/arm64-v8a/. "$GITHUB_WORKSPACE/native-engine/common/"
          cp -a "$X86_LIBS/." "$GITHUB_WORKSPACE/native-engine/x86/"
          cp -a "$ARM_LIBS/." "$GITHUB_WORKSPACE/native-engine/arm/"
          cp -a limbo-android-x86/src/main/assets/. "$GITHUB_WORKSPACE/native-engine/assets/"
          test -f "$GITHUB_WORKSPACE/native-engine/assets/QEMU_VERSION"
          test -f "$GITHUB_WORKSPACE/native-engine/assets/roms/bios.bin"

      - name: Upload multi-architecture native engine
        uses: actions/upload-artifact@v4
        with:
          name: wildfirelab-native-arm64-multiarch
          path: native-engine/
          if-no-files-found: error
          retention-days: 90
