name: Build TSkideOS ISO

on:
  push:
    branches:
      - main
      - tskideos-rebuild
    paths:
      - "tskideos/**"
      - ".github/workflows/build-tskideos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build bootable ISO
        run: |
          set -eux
          make -C tskideos clean iso
          file tskideos/build/kernel.elf tskideos/build/tskideos.iso
          grub-file --is-x86-multiboot tskideos/build/kernel.elf
          test -s tskideos/build/tskideos.iso

      - name: Boot and test Tiny Skide keyboard shell in QEMU
        run: |
          set -eu
          qemu-system-i386 -machine pc -m 128M -vga std -cdrom tskideos/build/tskideos.iso -boot d -display vnc=127.0.0.1:0 -serial file:tskideos/build/serial.log -monitor none -no-reboot -no-shutdown &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import pathlib
          import socket
          import struct
          import time

          log = pathlib.Path("tskideos/build/serial.log")
          for attempt in range(120):
              if log.exists() and "Tiny Skide desktop ready" in log.read_text(errors="replace"):
                  break
              time.sleep(0.1)
          else:
              raise SystemExit("QEMU did not finish booting")

          def receive_exact(connection, size):
              data = bytearray()
              while len(data) < size:
                  part = connection.recv(size - len(data))
                  if not part:
                      raise SystemExit("VNC connection closed during handshake")
                  data.extend(part)
              return bytes(data)

          vnc = socket.create_connection(("127.0.0.1", 5900), timeout=3)
          vnc.settimeout(3)
          version = receive_exact(vnc, 12)
          vnc.sendall(version)
          security_count = receive_exact(vnc, 1)[0]
          if security_count == 0:
              reason_length = struct.unpack(">I", receive_exact(vnc, 4))[0]
              raise SystemExit(receive_exact(vnc, reason_length).decode(errors="replace"))
          security_types = receive_exact(vnc, security_count)
          if 1 not in security_types:
              raise SystemExit("VNC server did not offer unauthenticated local testing")
          vnc.sendall(b"\x01")
          if struct.unpack(">I", receive_exact(vnc, 4))[0] != 0:
              raise SystemExit("VNC security handshake failed")
          vnc.sendall(b"\x01")
          server_init = receive_exact(vnc, 24)
          name_length = struct.unpack(">I", server_init[20:24])[0]
          receive_exact(vnc, name_length)

          def press(keysym):
              vnc.sendall(struct.pack(">BBHI", 4, 1, 0, keysym))
              time.sleep(0.08)
              vnc.sendall(struct.pack(">BBHI", 4, 0, 0, keysym))
              time.sleep(0.12)

          for key in map(ord, "thelp"):
              press(key)
          press(0xFF0D)
          time.sleep(0.5)
          vnc.close()
          PY
          cat tskideos/build/serial.log
          grep -q "TSkideOS 0.2.0 booting" tskideos/build/serial.log
          grep -q "framebuffer online" tskideos/build/serial.log
          grep -q "Tiny Skide desktop ready" tskideos/build/serial.log
          grep -q "shell command: help" tskideos/build/serial.log
      - name: Calculate ISO checksum
        run: |
          cd tskideos/build
          sha256sum tskideos.iso > tskideos.iso.sha256
          cat tskideos.iso.sha256

      - name: Upload TSkideOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: TSkideOS-0.2.0-ISO
          path: |
            tskideos/build/tskideos.iso
            tskideos/build/tskideos.iso.sha256
          if-no-files-found: error
          retention-days: 30
