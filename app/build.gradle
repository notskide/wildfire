plugins {
    id "com.android.application"
}

android {
    namespace "com.skide.tskideos"
    compileSdk 35

    defaultConfig {
        applicationId "com.skide.tskideos"
        minSdk 8
        targetSdk 8
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }
}
